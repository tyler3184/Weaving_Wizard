<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaving Wizard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #1a1a1a;
  color: #f0f0f0;
  margin: 0;
  padding: 30px;
}
#container {
  background-color: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}
h1 { margin-top: 0; }

#numberBoxes {
  display: flex;
  justify-content: space-between;
  margin: 20px auto;
}
.numberBox {
  flex: 1;
  margin: 0 5px;
  font-size: 100px;
  padding: 50px 0;
  text-align: center;
  background-color: #444;
  border: 2px solid #666;
  border-radius: 8px;
}

#colorSelectorTop {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  position: relative;
}
.color-box {
  flex: 1;
  margin: 0 5px;
  height: 40px;
  border-radius: 6px;
  border: 2px solid #666;
  cursor: pointer;
}

.color-picker-dropdown {
  position: absolute;
  display: none;
  background: #222;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.6);
  z-index: 20;
  width: 320px;
}

#pickInfo { margin-top: 10px; font-size: 18px; }

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.main-buttons button {
  font-size: 22px;
  padding: 15px 30px;
  border-radius: 6px;
  border: none;
  background-color: #5a5a5a;
  color: white;
  cursor: pointer;
}

.card {
  background-color: #3a3a3a;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}

input {
  padding: 6px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  margin: 5px;
}
</style>
</head>

<body>
<div id="container">
<h1>Weaving Wizard</h1>

<div id="colorSelectorTop"></div>

<div id="numberBoxes">
  <div class="numberBox" id="box1"></div>
  <div class="numberBox" id="box2"></div>
  <div class="numberBox" id="box3"></div>
  <div class="numberBox" id="box4"></div>
  <div class="numberBox" id="box5"></div>
  <div class="numberBox" id="box6"></div>
</div>

<div id="pickInfo">Pick: 0 of 0</div>

<div class="main-buttons">
  <button onclick="nextNumber()">Next</button>
  <button onclick="prevNumber()">Previous</button>
  <button onclick="reset()">Reset</button>
</div>

<div class="card">
  <label>Pattern (comma-separated):</label><br>
  <input id="patternInput" placeholder="1,2,3,4">
  <button onclick="loadPattern()">Load</button>
</div>

<!-- 🔹 NEW PICK RANGE COLOR BLOCK SECTION -->
<div class="card">
  <h3>Pick Range Color Blocks</h3>
  <label>Start Pick:</label>
  <input type="number" id="rangeStart" min="1">
  <label>End Pick:</label>
  <input type="number" id="rangeEnd" min="1">
  <button onclick="applyPickRange()">Apply Current Color</button>
</div>

</div>

<script>
let pattern=[], currentIndex=0;
let colorRules=[];
let pickBlocks=[];   // ← NEW
let activeColor="#888";

// --- Pattern ---
function loadPattern(){
  pattern=document.getElementById("patternInput").value
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean)
    .map(n=>[parseInt(n)]);
  currentIndex=0;
  updateDisplay();
  save();
}

function updateDisplay(){
  document.querySelectorAll(".numberBox").forEach(b=>{
    b.textContent="";
    b.style.background="#444";
    b.style.color="white";
  });

  if(!pattern.length) return;

  let pickColor=null;
  pickBlocks.forEach(b=>{
    if(currentIndex+1>=b.start && currentIndex+1<=b.end){
      pickColor=b.color;
    }
  });

  pattern[currentIndex].forEach(n=>{
    const box=document.getElementById("box"+n);
    box.textContent=n;
    box.style.background=pickColor || colorRules[n-1] || "#666";
  });

  document.getElementById("pickInfo").innerText=
    `Pick: ${currentIndex+1} of ${pattern.length}`;
}

function nextNumber(){ if(pattern.length){ currentIndex=(currentIndex+1)%pattern.length; updateDisplay(); save(); }}
function prevNumber(){ if(pattern.length){ currentIndex=(currentIndex-1+pattern.length)%pattern.length; updateDisplay(); save(); }}
function reset(){ currentIndex=0; updateDisplay(); save(); }

// --- Pick Range Blocks ---
function applyPickRange(){
  const start=parseInt(document.getElementById("rangeStart").value);
  const end=parseInt(document.getElementById("rangeEnd").value);
  if(!start || !end || start>end) return;
  pickBlocks.push({start,end,color:activeColor});
  updateDisplay();
  save();
}

// --- Colors ---
function createTopColorBoxes(){
  const cont=document.getElementById("colorSelectorTop");
  cont.innerHTML="";
  for(let i=0;i<6;i++){
    const d=document.createElement("div");
    d.className="color-box";
    d.style.background=colorRules[i]||"#666";
    d.onclick=()=>{
      activeColor=d.style.backgroundColor;
    };
    cont.appendChild(d);
  }
}

// --- Save ---
function save(){
  localStorage.setItem("pattern",JSON.stringify(pattern));
  localStorage.setItem("index",currentIndex);
  localStorage.setItem("blocks",JSON.stringify(pickBlocks));
}

function load(){
  pattern=JSON.parse(localStorage.getItem("pattern")||"[]");
  currentIndex=parseInt(localStorage.getItem("index")||0);
  pickBlocks=JSON.parse(localStorage.getItem("blocks")||"[]");
  createTopColorBoxes();
  updateDisplay();
}

window.onload=load;
</script>
</body>
</html>
