<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaving Wizard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #1a1a1a;
  color: #f0f0f0;
  margin: 0;
  padding: 30px;
}
#container {
  background-color: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}
h1 { margin-top: 0; }

/* Number boxes */
#numberBoxes {
  display: flex;
  justify-content: space-between;
  margin: 20px auto;
  width: 100%;
  cursor: pointer;
}
.numberBox {
  flex: 1;
  margin: 0 5px;
  font-size: 100px;
  padding: 50px 0;
  text-align: center;
  background-color: #444;
  border: 2px solid #666;
  border-radius: 8px;
}

/* Top color boxes */
#colorSelectorTop {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  position: relative;
}
.color-box {
  flex: 1;
  margin: 0 5px;
  height: 40px;
  border-radius: 6px;
  border: 2px solid #666;
  cursor: pointer;
}

/* Color picker dropdown */
.color-picker-dropdown {
  position: absolute;
  display: none;
  background: #222;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.6);
  z-index: 20;
  width: 320px;
}

.spectrum, .brightness {
  width: 100%;
  position: relative;
  cursor: crosshair;
  border-radius: 8px;
  margin-bottom: 12px;
}
.spectrum { height: 20px; }
.brightness { height: 140px; }

.spectrum-dot, .brightness-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid white;
  position: absolute;
  pointer-events: none;
  transform: translate(-50%, -50%);
  background: white;
}

#recentColors {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.recent-color {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  border: 1px solid #888;
  cursor: pointer;
}

#pickInfo { margin-top: 10px; font-size: 18px; }

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.main-buttons button {
  font-size: 22px;
  padding: 15px 30px;
  border-radius: 6px;
  border: none;
  background-color: #5a5a5a;
  color: white;
  cursor: pointer;
}

#progressContainer {
  width: 100%;
  background: #333;
  height: 10px;
  margin-top: 20px;
  border-radius: 6px;
}
#progress {
  height: 10px;
  background: limegreen;
  width: 0%;
  border-radius: 6px;
}

input[type="text"], input[type="number"], input[type="file"] {
  padding: 6px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  margin: 5px;
}
label { font-size: 16px; }
.card {
  background-color: #3a3a3a;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}
</style>
</head>
<body>
<div id="container">
  <h1>Weaving Wizard</h1>

  <div id="colorSelectorTop"></div>

  <div id="colorPicker" class="color-picker-dropdown">
    <div class="spectrum">
      <canvas id="spectrumCanvas"></canvas>
      <div class="spectrum-dot"></div>
    </div>
    <div class="brightness">
      <canvas id="brightnessCanvas"></canvas>
      <div class="brightness-dot"></div>
    </div>
    <div id="recentColors"></div>
  </div>

  <div id="numberBoxes">
    <div class="numberBox" id="box1" onclick="nextNumber()"></div>
    <div class="numberBox" id="box2" onclick="nextNumber()"></div>
    <div class="numberBox" id="box3" onclick="nextNumber()"></div>
    <div class="numberBox" id="box4" onclick="nextNumber()"></div>
    <div class="numberBox" id="box5" onclick="nextNumber()"></div>
    <div class="numberBox" id="box6" onclick="nextNumber()"></div>
  </div>

  <div id="pickInfo">Pick: 0 of 0</div>
  <div id="progressContainer"><div id="progress"></div></div>

  <div class="main-buttons">
    <button onclick="nextNumber()">Next</button>
    <button onclick="prevNumber()">Previous</button>
    <button onclick="reset()">Reset</button>
    <button onclick="clearMemory()">Clear Memory</button>
  </div>

  <div class="card">
    <label for="patternInput">Enter Pattern (comma-separated):</label><br>
    <input type="text" id="patternInput" placeholder="e.g. 1,2,3,4">
    <button onclick="loadPattern()">Load Pattern</button>
    <div style="margin-top: 20px;">
      <label for="jumpInput">Jump to Pick:</label><br>
      <input type="number" id="jumpInput" style="width: 80px;" min="1">
      <button onclick="jumpToPick()">Go</button>
    </div>
  </div>

  <!-- 🔹 ADDED: Pick range color block UI -->
  <div class="card">
    <label>Pick Range Color Block</label><br>
    <input type="number" id="rangeStart" min="1" placeholder="Start pick">
    <input type="number" id="rangeEnd" min="1" placeholder="End pick">
    <button onclick="applyPickRange()">Apply Pick Range</button>
  </div>

</div>

<script>
let pattern=[], currentIndex=0, colorRules=[], recentColors=[];

// 🔹 ADDED
let pickRanges=[];

let activeBox=null, hue=0, sat=100, bright=50;
let draggingSpectrum=false, draggingBrightness=false;

// --- Pattern functions ---
function loadPattern(){
  const input=document.getElementById("patternInput").value.replace(/\s/g,'');
  const items=input.split(',');
  pattern=items.map(p=>p.split('').map(Number).filter(n=>n>=1&&n<=6)).filter(p=>p.length);
  currentIndex=0; updateDisplay(); saveProgress();
}

function updateDisplay(){
  for(let i=1;i<=6;i++){
    const box=document.getElementById("box"+i);
    box.textContent="";
    box.style.backgroundColor="#444";
    box.style.color="white";
  }
  if(!pattern.length){document.getElementById("pickInfo").innerText="Pick: 0 of 0"; return;}

  // 🔹 ADDED: check pick ranges
  let rangeColor=null;
  pickRanges.forEach(r=>{
    if(currentIndex+1>=r.start && currentIndex+1<=r.end){
      rangeColor=r.color;
    }
  });

  const current=pattern[currentIndex];
  current.forEach(num=>{
    const b=document.getElementById("box"+num);
    b.textContent=num;
    const color = rangeColor || colorRules[num-1];
    if(color) b.style.backgroundColor=color;
  });

  document.getElementById("pickInfo").innerText=`Pick: ${currentIndex+1} of ${pattern.length}`;
  document.getElementById("progress").style.width=((currentIndex+1)/pattern.length*100)+"%";
  saveProgress();
}

function nextNumber(){if(!pattern.length)return; currentIndex=(currentIndex+1)%pattern.length; updateDisplay();}
function prevNumber(){if(!pattern.length)return; currentIndex=(currentIndex-1+pattern.length)%pattern.length; updateDisplay();}
function reset(){currentIndex=0; updateDisplay(); document.getElementById("progress").style.width="0%"; saveProgress();}

// 🔹 ADDED
function applyPickRange(){
  const start=parseInt(document.getElementById("rangeStart").value);
  const end=parseInt(document.getElementById("rangeEnd").value);
  if(!start||!end||start>end||!activeBox)return;
  pickRanges.push({start,end,color:activeBox.style.backgroundColor});
  saveProgress();
  updateDisplay();
}

function saveProgress(){
  localStorage.setItem("pattern",JSON.stringify(pattern));
  localStorage.setItem("currentIndex",currentIndex);
  localStorage.setItem("colorRules",JSON.stringify(colorRules));
  localStorage.setItem("recentColors",JSON.stringify(recentColors));
  localStorage.setItem("pickRanges",JSON.stringify(pickRanges)); // 🔹 ADDED
}

function loadProgress(){
  const savedPattern=localStorage.getItem("pattern");
  const savedIndex=localStorage.getItem("currentIndex");
  const savedRules=localStorage.getItem("colorRules");
  const savedRecent=localStorage.getItem("recentColors");
  const savedRanges=localStorage.getItem("pickRanges"); // 🔹 ADDED
  if(savedPattern) pattern=JSON.parse(savedPattern);
  if(savedIndex!==null) currentIndex=parseInt(savedIndex);
  if(savedRules) colorRules=JSON.parse(savedRules);
  if(savedRecent) recentColors=JSON.parse(savedRecent);
  if(savedRanges) pickRanges=JSON.parse(savedRanges);
  createTopColorBoxes(); updateDisplay(); updateRecentColors();
}

window.onload=loadProgress;
</script>
</body>
</html>
