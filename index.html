<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaving Wizard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #1a1a1a;
  color: #f0f0f0;
  padding: 30px;
}
#container {
  background-color: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
}

/* Top color boxes */
#colorSelectorTop {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  position: relative;
}
.color-box {
  flex: 1;
  margin: 0 5px;
  height: 40px;
  border-radius: 6px;
  border: 2px solid #666;
  background: #444;
  cursor: pointer;
}

/* Number boxes */
#numberBoxes {
  display: flex;
  justify-content: space-between;
  margin: 20px auto;
}
.numberBox {
  flex: 1;
  margin: 0 5px;
  font-size: 100px;
  padding: 50px 0;
  text-align: center;
  background-color: #444;
  border: 2px solid #666;
  border-radius: 8px;
}

/* Progress */
#progressContainer {
  width: 100%;
  background: #333;
  height: 10px;
  border-radius: 6px;
  margin-top: 10px;
}
#progress {
  height: 10px;
  background: limegreen;
  width: 0%;
  border-radius: 6px;
}

/* Color picker dropdown */
.color-picker-dropdown {
  position: absolute;
  display: none;
  background: #222;
  border-radius: 12px;
  padding: 15px;
  width: 340px;
  z-index: 50;
  text-align: center;
}

/* Hue slider */
#hueSlider {
  width: 300px;
  height: 6px;
  margin-bottom: 15px;
  cursor: pointer;
  border-radius: 6px;
}
#hueHandle {
  position: absolute;
  width: 14px;
  height: 16px;
  background: white;
  border: 2px solid black;
  border-radius: 4px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* Saturation-Brightness box */
#sbCanvas {
  width: 300px;
  height: 140px;
  margin: 0 auto;
  position: relative;
  cursor: crosshair;
}
#sbHandle {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid black;
  background: white;
  transform: translate(-50%, -50%);
  pointer-events: none;
  top: 0;
  left: 0;
}

/* Recent colors */
#recentColors {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  justify-content: center;
}
.recent-color {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid #777;
  cursor: pointer;
}

/* Buttons */
.main-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.main-buttons button {
  font-size: 22px;
  padding: 15px 30px;
  border-radius: 6px;
  border: none;
  background-color: #5a5a5a;
  color: white;
  cursor: pointer;
}

.card {
  background-color: #3a3a3a;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}
input[type="text"], input[type="number"], input[type="color"] {
  padding: 6px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  margin: 5px;
}
label { font-size: 16px; }
</style>
</head>

<body>
<div id="container">
<h1>Weaving Wizard</h1>

<!-- Top color boxes -->
<div id="colorSelectorTop"></div>

<!-- Color Picker Dropdown -->
<div id="colorPicker" class="color-picker-dropdown">
  <!-- Hue Slider -->
  <div style="position:relative;">
    <canvas id="hueSlider"></canvas>
    <div id="hueHandle"></div>
  </div>

  <!-- Saturation-Brightness Box -->
  <div style="position:relative; margin:0 auto;">
    <canvas id="sbCanvas"></canvas>
    <div id="sbHandle"></div>
  </div>

  <!-- Recent Colors -->
  <div id="recentColors"></div>
</div>

<!-- Number Boxes -->
<div id="numberBoxes">
  <div class="numberBox" id="box1" onclick="nextNumber()"></div>
  <div class="numberBox" id="box2" onclick="nextNumber()"></div>
  <div class="numberBox" id="box3" onclick="nextNumber()"></div>
  <div class="numberBox" id="box4" onclick="nextNumber()"></div>
  <div class="numberBox" id="box5" onclick="nextNumber()"></div>
  <div class="numberBox" id="box6" onclick="nextNumber()"></div>
</div>

<div id="pickInfo">Pick: 0 of 0</div>
<div id="progressContainer"><div id="progress"></div></div>

<div class="main-buttons">
  <button onclick="nextNumber()">Next</button>
  <button onclick="prevNumber()">Previous</button>
  <button onclick="reset()">Reset</button>
  <button onclick="clearMemory()">Clear Memory</button>
</div>

<!-- Pattern Input -->
<div class="card">
  <label>Pattern:</label><br>
  <input type="text" id="patternInput" placeholder="e.g. 123,456"><button onclick="loadPattern()">Load</button>
  <br>
  <label>Jump to Pick:</label><br>
  <input type="number" id="jumpInput" style="width:80px;">
  <button onclick="jumpToPick()">Go</button>
</div>

<!-- Color Range Override -->
<div class="card">
  <h3>Color Ranges (override)</h3>
  Start <input type="number" id="rangeStart" style="width:70px;">
  End <input type="number" id="rangeEnd" style="width:70px;">
  <input type="color" id="rangeColor">
  <button onclick="addColorRange()">Add</button>
  <div id="rangeList"></div>
</div>

</div>

<script>
/* ----------------- VARIABLES ----------------- */
let pattern=[], currentIndex=0;
let colorRules=Array(6).fill("#444");
let colorRanges=[], recentColors=[];
let activeBox=null;
let hue=0, sat=100, bright=50;
let draggingHue=false, draggingSB=false;
let hueOffset=0, sbOffsetX=0, sbOffsetY=0;

/* ----------------- TOP COLOR BOXES ----------------- */
function createTopColorBoxes(){
  const topDiv=document.getElementById("colorSelectorTop");
  topDiv.innerHTML='';
  for(let i=0;i<6;i++){
    const box=document.createElement("div");
    box.className="color-box";
    box.style.background=colorRules[i];
    box.onclick=()=>{activeBox=box; openPicker(box);};
    topDiv.appendChild(box);
  }
}

/* ----------------- COLOR PICKER ----------------- */
const colorPicker=document.getElementById("colorPicker");
const hueSlider=document.getElementById("hueSlider");
const hueCtx=hueSlider.getContext("2d");
const hueHandle=document.getElementById("hueHandle");
const sbCanvas=document.getElementById("sbCanvas");
const sbCtx=sbCanvas.getContext("2d");
const sbHandle=document.getElementById("sbHandle");
const recentDiv=document.getElementById("recentColors");

function openPicker(box){
  colorPicker.style.display='block';
  const r=box.getBoundingClientRect();
  colorPicker.style.left=r.left+'px';
  colorPicker.style.top=r.bottom+window.scrollY+'px';
  drawHue();
  drawSB();
  updateRecent();
}

document.addEventListener("click", e=>{
  if(!colorPicker.contains(e.target) && !e.target.classList.contains("color-box"))
    colorPicker.style.display='none';
});

/* ----------------- HUE SLIDER ----------------- */
function drawHue(){
  hueSlider.width=300;
  hueSlider.height=6;
  const grad=hueCtx.createLinearGradient(0,0,300,0);
  ["red","yellow","lime","cyan","blue","magenta","red"].forEach((c,i)=>grad.addColorStop(i/6,c));
  hueCtx.fillStyle=grad;
  hueCtx.fillRect(0,0,300,6);
}

hueSlider.addEventListener("mousedown", e=>{
  draggingHue=true;
  const rect=hueSlider.getBoundingClientRect();
  hueOffset=e.clientX-rect.left-hueHandle.offsetLeft;
  moveHue(e);
});
document.addEventListener("mousemove", e=>{if(draggingHue) moveHue(e);});
document.addEventListener("mouseup", ()=>draggingHue=false);

function moveHue(e){
  const rect=hueSlider.getBoundingClientRect();
  let x=Math.max(0, Math.min(e.clientX-rect.left-hueOffset+hueHandle.offsetLeft, rect.width));
  hue=x/rect.width*360;
  hueHandle.style.left=x+"px";
  hueHandle.style.top=(rect.height/2)+"px";
  drawSB();
  updateColor();
}

/* ----------------- SATURATION-BRIGHTNESS ----------------- */
function drawSB(){
  sbCanvas.width=300;
  sbCanvas.height=140;
  for(let y=0;y<140;y++){
    for(let x=0;x<300;x++){
      const s=(x/300)*100;
      const l=100-(y/140)*100;
      const rgb=hslToRgb(hue,s,l);
      sbCtx.fillStyle=`rgb(${rgb})`;
      sbCtx.fillRect(x,y,1,1);
    }
  }
}

sbCanvas.addEventListener("mousedown", e=>{
  draggingSB=true;
  const rect=sbCanvas.getBoundingClientRect();
  sbOffsetX=e.clientX-rect.left-sbHandle.offsetLeft;
  sbOffsetY=e.clientY-rect.top-sbHandle.offsetTop;
  moveSB(e);
});
document.addEventListener("mousemove", e=>{if(draggingSB) moveSB(e);});
document.addEventListener("mouseup", ()=>draggingSB=false);

function moveSB(e){
  const rect=sbCanvas.getBoundingClientRect();
  let x=Math.max(0, Math.min(e.clientX-rect.left-sbOffsetX+sbHandle.offsetLeft, rect.width));
  let y=Math.max(0, Math.min(e.clientY-rect.top-sbOffsetY+sbHandle.offsetTop, rect.height));
  sbHandle.style.left=x+"px";
  sbHandle.style.top=y+"px";
  sat=(x/rect.width)*100;
  bright=100-(y/rect.height)*100;
  updateColor();
}

/* ----------------- UPDATE COLOR ----------------- */
function updateColor(){
  if(!activeBox) return;
  const c=`hsl(${hue},${sat}%,${bright}%)`;
  activeBox.style.background=c;
  const i=[...document.querySelectorAll(".color-box")].indexOf(activeBox);
  colorRules[i]=c;

  if(!recentColors.includes(c)){
    recentColors.unshift(c);
    if(recentColors.length>5) recentColors.pop();
  }
  updateRecent();
  updateDisplay();
}

/* ----------------- RECENT COLORS ----------------- */
function updateRecent(){
  recentDiv.innerHTML='';
  recentColors.forEach(c=>{
    const d=document.createElement("div");
    d.className="recent-color";
    d.style.background=c;
    d.onclick=()=>{activeBox.style.background=c; updateColor();}
    recentDiv.appendChild(d);
  });
}

/* ----------------- PATTERN ----------------- */
function loadPattern(){
  const input=document.getElementById("patternInput").value.replace(/\s/g,'');
  pattern=input.split(',').map(p=>p.split('').map(Number));
  currentIndex=0;
  updateDisplay();
  saveProgress();
}

function jumpToPick(){
  const val=+document.getElementById("jumpInput").value-1;
  if(val>=0 && val<pattern.length){currentIndex=val; updateDisplay(); saveProgress();}
}

function getOverrideColor(){
  const pickNum=currentIndex+1;
  for(const r of colorRanges){
    if(pickNum>=r.start && pickNum<=r.end) return r.color;
  }
  return null;
}

function updateDisplay(){
  for(let i=1;i<=6;i++){
    const b=document.getElementById("box"+i);
    b.textContent=''; b.style.background='#444';
  }
  if(!pattern.length){document.getElementById("progress").style.width="0%"; return;}
  const override=getOverrideColor();
  pattern[currentIndex].forEach(n=>{
    const b=document.getElementById("box"+n);
    b.textContent=n;
    b.style.background=override||colorRules[n-1];
  });
  document.getElementById("pickInfo").innerText=`Pick: ${currentIndex+1} of ${pattern.length}`;
  document.getElementById("progress").style.width=((currentIndex+1)/pattern.length*100)+"%";
  saveProgress();
}

function nextNumber(){if(pattern.length){currentIndex=(currentIndex+1)%pattern.length; updateDisplay();}}
function prevNumber(){if(pattern.length){currentIndex=(currentIndex-1+pattern.length)%pattern.length; updateDisplay();}}
function reset(){currentIndex=0; updateDisplay(); document.getElementById("progress").style.width="0%"; saveProgress();}
function clearMemory(){pattern=[]; currentIndex=0; colorRules=Array(6).fill("#444"); colorRanges=[]; recentColors=[]; createTopColorBoxes(); updateDisplay(); localStorage.clear();}

/* ----------------- COLOR RANGE ----------------- */
function addColorRange(){
  const s=+document.getElementById("rangeStart").value;
  const e=+document.getElementById("rangeEnd").value;
  const c=document.getElementById("rangeColor").value;
  if(!s||!e||e<s) return;
  colorRanges.push({start:s,end:e,color:c});
  renderRanges();
  updateDisplay();
}
function renderRanges(){
  const list=document.getElementById("rangeList");
  list.innerHTML='';
  colorRanges.forEach(r=>{
    const d=document.createElement("div");
    d.innerHTML=`${r.start}-${r.end} <span style="color:${r.color}">${r.color}</span>`;
    list.appendChild(d);
  });
}

/* ----------------- UTILITIES ----------------- */
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}

/* ----------------- SAVE/LOAD ----------------- */
function saveProgress(){
  localStorage.setItem("pattern",JSON.stringify(pattern));
  localStorage.setItem("currentIndex",currentIndex);
  localStorage.setItem("colorRules",JSON.stringify(colorRules));
  localStorage.setItem("recentColors",JSON.stringify(recentColors));
  localStorage.setItem("colorRanges",JSON.stringify(colorRanges));
}
function loadProgress(){
  const p=localStorage.getItem("pattern");
  const i=localStorage.getItem("currentIndex");
  const r=localStorage.getItem("colorRules");
  const rc=localStorage.getItem("recentColors");
  const cr=localStorage.getItem("colorRanges");
  if(p) pattern=JSON.parse(p);
  if(i!==null) currentIndex=parseInt(i);
  if(r) colorRules=JSON.parse(r);
  if(rc) recentColors=JSON.parse(rc);
  if(cr) colorRanges=JSON.parse(cr);
  createTopColorBoxes();
  renderRanges();
  updateDisplay();
}

window.onload=loadProgress;
createTopColorBoxes();
</script>
</body>
</html>
