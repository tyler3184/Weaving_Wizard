<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaving Wizard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #1a1a1a;
  color: #f0f0f0;
  padding: 30px;
}
#container {
  background-color: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
}

/* ---------- TOP COLOR BOXES ---------- */
#colorSelectorTop {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  position: relative;
}
.color-box {
  flex: 1;
  margin: 0 5px;
  height: 40px;
  border-radius: 6px;
  border: 2px solid #666;
  background: #444;
  cursor: pointer;
}

/* ---------- NUMBER BOXES ---------- */
#numberBoxes {
  display: flex;
  justify-content: space-between;
  margin: 20px auto;
}
.numberBox {
  flex: 1;
  margin: 0 5px;
  font-size: 100px;
  padding: 50px 0;
  text-align: center;
  background-color: #444;
  border: 2px solid #666;
  border-radius: 8px;
}

/* ---------- PROGRESS ---------- */
#progressContainer {
  width: 100%;
  background: #333;
  height: 10px;
  border-radius: 6px;
  margin-top: 10px;
}
#progress {
  height: 10px;
  background: limegreen;
  width: 0%;
  border-radius: 6px;
}

/* ---------- COLOR PICKER ---------- */
.color-picker-dropdown {
  position: absolute;
  display: none;
  background: #222;
  border-radius: 12px;
  padding: 15px;
  width: 340px;
  z-index: 50;
  text-align: center;
}

/* Hue slider */
#hueSlider {
  width: 300px;
  height: 12px; /* thinner */
  margin-bottom: 15px;
  cursor: pointer;
  border-radius: 6px; /* rounded corners */
}
#hueHandle {
  position: absolute;
  width: 14px;
  height: 16px;
  background: white;
  border: 2px solid black;
  border-radius: 4px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* Saturation-Brightness box */
#sbCanvas {
  width: 300px;
  height: 140px;
  margin: 0 auto; /* center in dropdown */
  position: relative;
  cursor: crosshair;
}
#sbHandle {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid black;
  background: white;
  transform: translate(-50%, -50%);
  pointer-events: none;
  top: 0;
  left: 0;
}

/* Recent colors */
#recentColors {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  justify-content: center;
}
.recent-color {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid #777;
  cursor: pointer;
}

/* Buttons */
.main-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.main-buttons button {
  font-size: 22px;
  padding: 15px 30px;
  border-radius: 6px;
  border: none;
  background-color: #5a5a5a;
  color: white;
  cursor: pointer;
}

.card {
  background-color: #3a3a3a;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}
</style>
</head>

<body>
<div id="container">
<h1>Weaving Wizard</h1>

<!-- Top color boxes -->
<div id="colorSelectorTop"></div>

<!-- Color picker dropdown -->
<div id="colorPicker" class="color-picker-dropdown">
  <!-- Hue slider -->
  <div style="position:relative;">
    <canvas id="hueSlider"></canvas>
    <div id="hueHandle"></div>
  </div>

  <!-- Saturation-Brightness box -->
  <div style="position:relative; margin: 0 auto;">
    <canvas id="sbCanvas"></canvas>
    <div id="sbHandle"></div>
  </div>

  <!-- Recent colors -->
  <div id="recentColors"></div>
</div>

<div id="numberBoxes">
  <div class="numberBox" id="box1" onclick="nextNumber()"></div>
  <div class="numberBox" id="box2" onclick="nextNumber()"></div>
  <div class="numberBox" id="box3" onclick="nextNumber()"></div>
  <div class="numberBox" id="box4" onclick="nextNumber()"></div>
  <div class="numberBox" id="box5" onclick="nextNumber()"></div>
  <div class="numberBox" id="box6" onclick="nextNumber()"></div>
</div>

<div id="pickInfo">Pick: 0 of 0</div>
<div id="progressContainer"><div id="progress"></div></div>

<div class="main-buttons">
  <button onclick="nextNumber()">Next</button>
  <button onclick="prevNumber()">Previous</button>
  <button onclick="reset()">Reset</button>
  <button onclick="clearMemory()">Clear Memory</button>
</div>

<div class="card">
  <label>Pattern:</label><br>
  <input type="text" id="patternInput">
  <button onclick="loadPattern()">Load</button>
</div>
</div>

<script>
let pattern=[], currentIndex=0;
let colorRules=Array(6).fill("#444");
let recentColors=[];
let activeBox=null;
let hue=0, sat=100, bright=50;
let draggingHue=false, draggingSB=false;

/* ---------- TOP COLOR BOXES ---------- */
function createTopColorBoxes(){
  const topDiv=document.getElementById("colorSelectorTop");
  topDiv.innerHTML='';
  for(let i=0;i<6;i++){
    const box=document.createElement("div");
    box.className="color-box";
    box.style.background=colorRules[i];
    box.onclick=()=>{activeBox=box; openPicker(box);};
    topDiv.appendChild(box);
  }
}

/* ---------- COLOR PICKER ---------- */
const colorPicker=document.getElementById("colorPicker");
const hueSlider=document.getElementById("hueSlider");
const hueCtx=hueSlider.getContext("2d");
const hueHandle=document.getElementById("hueHandle");

const sbCanvas=document.getElementById("sbCanvas");
const sbCtx=sbCanvas.getContext("2d");
const sbHandle=document.getElementById("sbHandle");

const recentDiv=document.getElementById("recentColors");

function openPicker(box){
  colorPicker.style.display='block';
  const r=box.getBoundingClientRect();
  colorPicker.style.left=r.left+'px';
  colorPicker.style.top=r.bottom+window.scrollY+'px';
  drawHue();
  drawSB();
  updateRecent();
}

document.addEventListener("click", e=>{
  if(!colorPicker.contains(e.target) && !e.target.classList.contains("color-box"))
    colorPicker.style.display='none';
});

/* ---------- HUE SLIDER ---------- */
function drawHue(){
  hueSlider.width=300;
  hueSlider.height=12;
  const grad=hueCtx.createLinearGradient(0,0,300,0);
  ["red","yellow","lime","cyan","blue","magenta","red"].forEach((c,i)=>grad.addColorStop(i/6,c));
  hueCtx.fillStyle=grad;
  hueCtx.fillRect(0,0,300,12);
}

hueSlider.addEventListener("mousedown", e=>{draggingHue=true; moveHue(e);});
document.addEventListener("mousemove", e=>{if(draggingHue) moveHue(e);});
document.addEventListener("mouseup", ()=>draggingHue=false);

function moveHue(e){
  const rect=hueSlider.getBoundingClientRect();
  let x=Math.max(0, Math.min(e.clientX-rect.left, rect.width));
  hue=x/rect.width*360;
  hueHandle.style.left=x+"px";
  hueHandle.style.top=(rect.height/2)+"px";
  drawSB();
  updateColor();
}

/* ---------- SATURATION-BRIGHTNESS BOX ---------- */
function drawSB(){
  sbCanvas.width=300;
  sbCanvas.height=140;
  for(let y=0;y<140;y++){
    for(let x=0;x<300;x++){
      const s=(x/300)*100;
      const l=100-(y/140)*100;
      const rgb=hslToRgb(hue,s,l);
      sbCtx.fillStyle=`rgb(${rgb})`;
      sbCtx.fillRect(x,y,1,1);
    }
  }
}

sbCanvas.addEventListener("mousedown", e=>{draggingSB=true; moveSB(e);});
document.addEventListener("mousemove", e=>{if(draggingSB) moveSB(e);});
document.addEventListener("mouseup", ()=>draggingSB=false);

function moveSB(e){
  const rect=sbCanvas.getBoundingClientRect();
  let x=Math.max(0, Math.min(e.clientX-rect.left, rect.width));
  let y=Math.max(0, Math.min(e.clientY-rect.top, rect.height));
  sbHandle.style.left=x+"px";
  sbHandle.style.top=y+"px";
  sat=(x/rect.width)*100;
  bright=100-(y/rect.height)*100;
  updateColor();
}

/* ---------- UPDATE COLOR ---------- */
function updateColor(){
  if(!activeBox) return;
  const c=`hsl(${hue},${sat}%,${bright}%)`;
  activeBox.style.background=c;
  const i=[...document.querySelectorAll(".color-box")].indexOf(activeBox);
  colorRules[i]=c;

  if(!recentColors.includes(c)){
    recentColors.unshift(c);
    if(recentColors.length>5) recentColors.pop();
  }
  updateRecent();
  updateDisplay();
}

/* ---------- RECENT COLORS ---------- */
function updateRecent(){
  recentDiv.innerHTML='';
  recentColors.forEach(c=>{
    const d=document.createElement("div");
    d.className="recent-color";
    d.style.background=c;
    d.onclick=()=>{activeBox.style.background=c; updateColor();}
    recentDiv.appendChild(d);
  });
}

/* ---------- PATTERN ---------- */
function loadPattern(){
  pattern=patternInput.value.split(',').map(p=>p.split('').map(Number));
  currentIndex=0; updateDisplay();
}

function updateDisplay(){
  for(let i=1;i<=6;i++){
    const b=document.getElementById("box"+i);
    b.textContent=''; b.style.background='#444';
  }
  if(!pattern.length){progress.style.width="0%";return;}
  pattern[currentIndex].forEach(n=>{
    const b=document.getElementById("box"+n);
    b.textContent=n;
    b.style.background=colorRules[n-1];
  });
  pickInfo.innerText=`Pick: ${currentIndex+1} of ${pattern.length}`;
  progress.style.width=((currentIndex+1)/pattern.length*100)+"%";
}

function nextNumber(){if(pattern.length){currentIndex=(currentIndex+1)%pattern.length;updateDisplay();}}
function prevNumber(){if(pattern.length){currentIndex=(currentIndex-1+pattern.length)%pattern.length;updateDisplay();}}
function reset(){currentIndex=0;updateDisplay();}
function clearMemory(){pattern=[];updateDisplay();}

/* ---------- UTIL ---------- */
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}

createTopColorBoxes();
</script>
</body>
</html>
