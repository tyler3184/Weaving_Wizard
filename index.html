<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weaving Wizard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#1a1a1a;
  color:#f0f0f0;
  padding:30px;
}
#container {
  background:#2a2a2a;
  padding:30px;
  border-radius:12px;
  max-width:900px;
  margin:auto;
}

#colorSelectorTop {
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.color-box {
  flex:1;
  height:40px;
  border-radius:6px;
  border:2px solid #666;
  cursor:pointer;
}

#numberBoxes {
  display:flex;
  gap:8px;
  margin:20px 0;
}
.numberBox {
  flex:1;
  font-size:100px;
  padding:50px 0;
  text-align:center;
  border-radius:8px;
  background:#444;
  border:2px solid #666;
}

#progressContainer {
  width:100%;
  height:10px;
  background:#333;
  border-radius:6px;
  margin-top:10px;
}
#progress {
  height:100%;
  background:limegreen;
  width:0%;
  border-radius:6px;
}

.color-picker-dropdown {
  position:absolute;
  display:none;
  background:#222;
  border-radius:12px;
  padding:15px;
  width:320px;
  z-index:50;
}

#hueSlider {
  position:relative;
  height:4px;
  border-radius:6px;
  background:linear-gradient(to right,
    red, yellow, lime, cyan, blue, magenta, red);
  margin-bottom:12px;
  cursor:pointer;
}
#hueHandle {
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:white;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#sbWrap {
  display:flex;
  justify-content:center;
  position:relative;
}
#sbCanvas {
  border-radius:6px;
  cursor:crosshair;
}
#sbHandle {
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid black;
  background:white;
  pointer-events:none;
  transform:translate(-50%,-50%);
}

#recentColors {
  display:flex;
  gap:6px;
  margin-top:10px;
  justify-content:center;
}
.recent-color {
  width:26px;
  height:26px;
  border-radius:6px;
  border:1px solid #777;
  cursor:pointer;
}

.main-buttons {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}
.main-buttons button {
  font-size:22px;
  padding:15px 30px;
  border-radius:6px;
  border:none;
  background-color:#5a5a5a;
  color:white;
  cursor:pointer;
}

.card {
  background:#3a3a3a;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}
input {
  padding:6px;
  font-size:16px;
  border-radius:4px;
  border:none;
}
</style>
</head>

<body>
<div id="container">
<h1>Weaving Wizard</h1>

<div id="colorSelectorTop"></div>

<div id="colorPicker" class="color-picker-dropdown">
  <div id="hueSlider"><div id="hueHandle"></div></div>
  <div id="sbWrap">
    <canvas id="sbCanvas" width="280" height="140"></canvas>
    <div id="sbHandle"></div>
  </div>
  <div id="recentColors"></div>
</div>

<div id="numberBoxes">
  <div class="numberBox" id="box1"></div>
  <div class="numberBox" id="box2"></div>
  <div class="numberBox" id="box3"></div>
  <div class="numberBox" id="box4"></div>
  <div class="numberBox" id="box5"></div>
  <div class="numberBox" id="box6"></div>
</div>

<div id="pickInfo">Pick: 0 of 0</div>
<div id="progressContainer"><div id="progress"></div></div>

<div class="main-buttons">
  <button onclick="prevPick()">Previous</button>
  <button onclick="nextPick()">Next</button>
  <button onclick="resetPick()">Reset</button>
  <button onclick="clearMemory()">Clear Memory</button>
</div>

<div class="card">
Pattern:
<input id="patternInput">
<button onclick="loadPattern()">Load</button>
Jump to:
<input type="number" id="jumpInput" style="width:70px;">
<button onclick="jumpTo()">Go</button>
</div>

<div class="card">
<h3>Color Range Override</h3>
Start <input id="rangeStart" type="number" style="width:60px;">
End <input id="rangeEnd" type="number" style="width:60px;">
<input type="color" id="rangeColor">
<button onclick="addRange()">Add</button>
<div id="rangeList"></div>
</div>
</div>

<script>
let pattern=[], idx=0;
let colorRules=Array(6).fill("hsl(0,100%,50%)");
let ranges=[];
let recentColors=[];
let activeBox=null;
let hue=0, sat=100, light=50;
let draggingHue=false, draggingSB=false;

/* ---------- SAVE / LOAD ---------- */
function save(){
  localStorage.setItem("weavingWizard",
    JSON.stringify({pattern,idx,colorRules,ranges,recentColors}));
}
function load(){
  const d=JSON.parse(localStorage.getItem("weavingWizard")||"null");
  if(!d) return;
  pattern=d.pattern||[];
  idx=d.idx||0;
  colorRules=d.colorRules||colorRules;
  ranges=d.ranges||[];
  recentColors=d.recentColors||[];
  buildColors(); renderRanges(); updateRecentColors(); update();
}
function clearMemory(){
  localStorage.removeItem("weavingWizard");
  pattern=[]; idx=0; ranges=[]; recentColors=[];
  buildColors(); updateRecentColors(); update();
}
window.onload=load;

/* ---------- COLORS ---------- */
function buildColors(){
  colorSelectorTop.innerHTML="";
  colorRules.forEach((c,i)=>{
    const d=document.createElement("div");
    d.className="color-box";
    d.style.background=c;
    d.onclick=e=>openPicker(e,i);
    colorSelectorTop.appendChild(d);
  });
}
buildColors();

function openPicker(e,i){
  activeBox=i;
  colorPicker.style.display="block";
  const r=e.target.getBoundingClientRect();
  colorPicker.style.left=r.left+"px";
  colorPicker.style.top=r.bottom+window.scrollY+"px";
  drawSB();
  updateRecentColors();
}
document.addEventListener("mousedown",e=>{
  if(!colorPicker.contains(e.target)&&!e.target.classList.contains("color-box"))
    colorPicker.style.display="none";
});

/* ---------- HUE ---------- */
const hueSlider=document.getElementById("hueSlider");
const hueHandle=document.getElementById("hueHandle");

function moveHue(e){
  const r=hueSlider.getBoundingClientRect();
  let x=Math.max(0,Math.min(e.clientX-r.left,r.width));
  hue=Math.round((x/r.width)*360/5)*5;
  hueHandle.style.left=(hue/360*r.width)+"px";
  drawSB(); applyColor();
}
hueSlider.onmousedown=e=>{draggingHue=true;moveHue(e);}
document.onmousemove=e=>{
  if(draggingHue) moveHue(e);
  if(draggingSB) moveSB(e);
}
document.onmouseup=()=>{draggingHue=false;draggingSB=false;}

/* ---------- SAT / LIGHT ---------- */
const sbCanvas=document.getElementById("sbCanvas");
const sbCtx=sbCanvas.getContext("2d");
const sbHandle=document.getElementById("sbHandle");

function drawSB(){
  for(let y=0;y<sbCanvas.height;y++){
    for(let x=0;x<sbCanvas.width;x++){
      const s=x/sbCanvas.width*100;
      const l=100-y/sbCanvas.height*100;
      sbCtx.fillStyle=`hsl(${hue},${s}%,${l}%)`;
      sbCtx.fillRect(x,y,1,1);
    }
  }
}
function moveSB(e){
  const r=sbCanvas.getBoundingClientRect();
  let x=Math.max(0,Math.min(e.clientX-r.left,r.width));
  let y=Math.max(0,Math.min(e.clientY-r.top,r.height));
  sat=Math.round(x/r.width*100);
  light=Math.round(100-y/r.height*100);
  sbHandle.style.left=x+"px";
  sbHandle.style.top=y+"px";
  applyColor();
}
sbCanvas.onmousedown=e=>{draggingSB=true;moveSB(e);};

/* ---------- COLOR UTILS ---------- */
function getTextColor(bg){
  if(bg.startsWith("hsl")){
    const l=+bg.match(/(\d+)%\)/)[1];
    return l<55?"#fff":"#111";
  }
  // hex fallback
  const c=bg.substring(1);
  const rgb=parseInt(c,16);
  const r=(rgb>>16)&255,g=(rgb>>8)&255,b=rgb&255;
  const lum=(0.299*r+0.587*g+0.114*b);
  return lum<140?"#fff":"#111";
}

/* ---------- APPLY COLOR ---------- */
function applyColor(){
  const c=`hsl(${hue},${sat}%,${light}%)`;
  colorRules[activeBox]=c;

  if(!recentColors.includes(c)){
    recentColors.unshift(c);
    if(recentColors.length>5) recentColors.pop();
  }

  buildColors(); updateRecentColors(); update(); save();
}

/* ---------- RECENT COLORS ---------- */
function updateRecentColors(){
  const wrap=document.getElementById("recentColors");
  wrap.innerHTML="";
  recentColors.forEach(c=>{
    const d=document.createElement("div");
    d.className="recent-color";
    d.style.background=c;
    d.onclick=()=>{
      const [h,s,l]=c.match(/\d+/g).map(Number);
      hue=h; sat=s; light=l;
      applyColor();
    };
    wrap.appendChild(d);
  });
}

/* ---------- PATTERN ---------- */
function loadPattern(){
  pattern=patternInput.value.split(",").map(p=>p.split("").map(Number));
  idx=0; update(); save();
}
function update(){
  for(let i=1;i<=6;i++){
    const b=document.getElementById("box"+i);
    b.textContent=""; b.style.background="#444";
  }
  if(!pattern.length) return;

  const override=getOverride();
  pattern[idx].forEach(n=>{
    const b=document.getElementById("box"+n);
    const bg=override||colorRules[n-1];
    b.textContent=n;
    b.style.background=bg;
    b.style.color=getTextColor(bg);
  });

  pickInfo.textContent=`Pick: ${idx+1} of ${pattern.length}`;
  progress.style.width=((idx+1)/pattern.length*100)+"%";
}
function nextPick(){idx=(idx+1)%pattern.length;update();save();}
function prevPick(){idx=(idx-1+pattern.length)%pattern.length;update();save();}
function resetPick(){idx=0;update();save();}
function jumpTo(){
  const n=+jumpInput.value-1;
  if(n>=0&&n<pattern.length){idx=n;update();save();}
}

/* ---------- RANGES ---------- */
function addRange(){
  ranges.push({s:+rangeStart.value,e:+rangeEnd.value,c:rangeColor.value});
  renderRanges(); update(); save();
}
function renderRanges(){
  rangeList.innerHTML="";
  ranges.forEach(r=>{
    const d=document.createElement("div");
    d.textContent=`${r.s}-${r.e} ${r.c}`;
    rangeList.appendChild(d);
  });
}
function getOverride(){
  const p=idx+1;
  const r=ranges.find(r=>p>=r.s&&p<=r.e);
  return r?r.c:null;
}
</script>
</body>
</html>
