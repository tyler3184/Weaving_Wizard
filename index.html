<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaving Wizard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #1a1a1a;
  color: #f0f0f0;
  margin: 0;
  padding: 30px;
}
#container {
  background-color: #2a2a2a;
  padding: 30px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}
h1 { margin-top: 0; }

/* Number boxes */
#numberBoxes {
  display: flex;
  justify-content: space-between;
  margin: 20px auto;
  width: 100%;
  cursor: pointer;
}
.numberBox {
  flex: 1;
  margin: 0 5px;
  font-size: 100px;
  padding: 50px 0;
  text-align: center;
  background-color: #444;
  border: 2px solid #666;
  border-radius: 8px;
}

/* Top color boxes */
#colorSelectorTop {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  position: relative;
}
.color-box {
  flex: 1;
  margin: 0 5px;
  height: 40px;
  border-radius: 6px;
  border: 2px solid #666;
  cursor: pointer;
}

/* Color picker dropdown */
.color-picker-dropdown {
  position: absolute;
  display: none;
  background: #222;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.6);
  z-index: 20;
  width: 320px;
}

.spectrum, .brightness {
  width: 100%;
  position: relative;
  cursor: crosshair;
  border-radius: 8px;
  margin-bottom: 12px;
}
.spectrum { height: 20px; }
.brightness { height: 140px; }

.spectrum-dot, .brightness-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid white;
  position: absolute;
  pointer-events: none;
  transform: translate(-50%, -50%);
  background: white;
}

#recentColors {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.recent-color {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  border: 1px solid #888;
  cursor: pointer;
}

#pickInfo { margin-top: 10px; font-size: 18px; }

.main-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.main-buttons button {
  font-size: 22px;
  padding: 15px 30px;
  border-radius: 6px;
  border: none;
  background-color: #5a5a5a;
  color: white;
  cursor: pointer;
}

#progressContainer {
  width: 100%;
  background: #333;
  height: 10px;
  margin-top: 20px;
  border-radius: 6px;
}
#progress {
  height: 10px;
  background: limegreen;
  width: 0%;
  border-radius: 6px;
}

input[type="text"], input[type="number"], input[type="file"] {
  padding: 6px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  margin: 5px;
}
label { font-size: 16px; }
.card {
  background-color: #3a3a3a;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}
</style>
</head>
<body>
<div id="container">
  <h1>Weaving Wizard</h1>

  <div id="colorSelectorTop"></div>

  <div id="colorPicker" class="color-picker-dropdown">
    <div class="spectrum">
      <canvas id="spectrumCanvas"></canvas>
      <div class="spectrum-dot"></div>
    </div>
    <div class="brightness">
      <canvas id="brightnessCanvas"></canvas>
      <div class="brightness-dot"></div>
    </div>
    <div id="recentColors"></div>
  </div>

  <div id="numberBoxes">
    <div class="numberBox" id="box1"></div>
    <div class="numberBox" id="box2"></div>
    <div class="numberBox" id="box3"></div>
    <div class="numberBox" id="box4"></div>
    <div class="numberBox" id="box5"></div>
    <div class="numberBox" id="box6"></div>
  </div>

  <div id="pickInfo">Pick: 0 of 0</div>
  <div id="progressContainer"><div id="progress"></div></div>

  <div class="main-buttons">
    <button onclick="nextNumber()">Next</button>
    <button onclick="prevNumber()">Previous</button>
    <button onclick="reset()">Reset</button>
    <button onclick="clearMemory()">Clear Memory</button>
  </div>

  <div class="card">
    <label for="patternInput">Enter Pattern (comma-separated):</label><br>
    <input type="text" id="patternInput" placeholder="e.g. 1,2,3,4">
    <button onclick="loadPattern()">Load Pattern</button>
    <div style="margin-top: 20px;">
      <label for="jumpInput">Jump to Pick:</label><br>
      <input type="number" id="jumpInput" style="width: 80px;" min="1">
      <button onclick="jumpToPick()">Go</button>
    </div>
  </div>
</div>

<script>
let pattern=[], currentIndex=0, colorRules=[], recentColors=[];
let activeBox=null, hue=0, sat=100, bright=50;
let draggingSpectrum=false, draggingBrightness=false;

// --- Pattern functions ---
function loadPattern(){
  const input=document.getElementById("patternInput").value.replace(/\s/g,'');
  const items=input.split(',');
  pattern=items.map(p=>p.split('').map(Number).filter(n=>n>=1&&n<=6)).filter(p=>p.length);
  currentIndex=0; updateDisplay(); saveProgress();
}

function updateDisplay(){
  for(let i=1;i<=6;i++){
    const box=document.getElementById("box"+i);
    box.textContent=""; 
    box.style.backgroundColor="#444"; 
    box.style.color="white";
  }
  if(!pattern.length){document.getElementById("pickInfo").innerText="Pick: 0 of 0"; return;}
  const current=pattern[currentIndex];
  current.forEach(num=>{
    const b=document.getElementById("box"+num);
    b.textContent=num;
    if(colorRules[num-1]) b.style.backgroundColor=colorRules[num-1];
    const rgb=b.style.backgroundColor.match(/\d+/g);
    if(rgb){
      const brightness=(parseInt(rgb[0])*299+parseInt(rgb[1])*587+parseInt(rgb[2])*114)/1000;
      b.style.color=brightness>128?"black":"white";
    }
  });
  document.getElementById("pickInfo").innerText=`Pick: ${currentIndex+1} of ${pattern.length}`;
  document.getElementById("progress").style.width=((currentIndex+1)/pattern.length*100)+"%";
  saveProgress();
}

function nextNumber(){if(!pattern.length)return; currentIndex=(currentIndex+1)%pattern.length; updateDisplay();}
function prevNumber(){if(!pattern.length)return; currentIndex=(currentIndex-1+pattern.length)%pattern.length; updateDisplay();}
function reset(){currentIndex=0; updateDisplay(); document.getElementById("progress").style.width="0%"; saveProgress();}
function saveProgress(){
  localStorage.setItem("pattern",JSON.stringify(pattern));
  localStorage.setItem("currentIndex",currentIndex);
  localStorage.setItem("colorRules",JSON.stringify(colorRules));
  localStorage.setItem("recentColors",JSON.stringify(recentColors));
}

function loadProgress(){
  const savedPattern=localStorage.getItem("pattern");
  const savedIndex=localStorage.getItem("currentIndex");
  const savedRules=localStorage.getItem("colorRules");
  const savedRecent=localStorage.getItem("recentColors");
  if(savedPattern) pattern=JSON.parse(savedPattern);
  if(savedIndex!==null) currentIndex=parseInt(savedIndex);
  if(savedRules) colorRules=JSON.parse(savedRules);
  if(savedRecent) recentColors=JSON.parse(savedRecent);
  createTopColorBoxes(); updateDisplay(); updateRecentColors();
}

function clearMemory(){localStorage.clear(); pattern=[]; currentIndex=0; colorRules=[]; recentColors=[]; createTopColorBoxes(); updateDisplay();}

// --- Color boxes ---
function createTopColorBoxes(){
  const cont=document.getElementById("colorSelectorTop");
  cont.innerHTML='';
  for(let i=0;i<6;i++){
    const box=document.createElement("div");
    box.className="color-box";
    box.style.backgroundColor=colorRules[i]||"#444";
    box.onclick=(e)=>{activeBox=box; openColorPicker(box);};
    cont.appendChild(box);
  }
}

// --- Color Picker ---
function openColorPicker(box){
  const picker=document.getElementById("colorPicker");
  picker.style.display='block';
  const rect=box.getBoundingClientRect();
  picker.style.left=rect.left+'px';
  picker.style.top=rect.bottom + window.scrollY + 'px';
  drawSpectrum(); drawBrightness(); updateRecentColors();
}

document.addEventListener('click', e=>{
  const picker=document.getElementById("colorPicker");
  if(!picker.contains(e.target) && !e.target.classList.contains("color-box")){
    picker.style.display='none';
  }
});

// --- Spectrum ---
const spectrumCanvas=document.getElementById("spectrumCanvas");
const sCtx=spectrumCanvas.getContext("2d");
const spectrumDot=document.querySelector('.spectrum-dot');

function drawSpectrum(){
  spectrumCanvas.width=spectrumCanvas.parentElement.offsetWidth;
  spectrumCanvas.height=20;
  const grad=sCtx.createLinearGradient(0,0,spectrumCanvas.width,0);
  ["red","yellow","lime","cyan","blue","magenta","red"].forEach((c,i)=>grad.addColorStop(i/6,c));
  sCtx.fillStyle=grad; sCtx.fillRect(0,0,spectrumCanvas.width,spectrumCanvas.height);
}
function pickSpectrum(e){
  draggingSpectrum=true;
  const rect=spectrumCanvas.getBoundingClientRect();
  let x=Math.min(Math.max(e.clientX-rect.left,0),rect.width);
  spectrumDot.style.left=x+'px'; spectrumDot.style.top='50%';
  hue=x/rect.width*360;
  drawBrightness();
  updateActiveBoxColor();
}
spectrumCanvas.addEventListener('mousedown', pickSpectrum);
document.addEventListener('mousemove', e=>{if(draggingSpectrum) pickSpectrum(e);});
document.addEventListener('mouseup', ()=>draggingSpectrum=false);

// --- Brightness ---
const brightnessCanvas=document.getElementById("brightnessCanvas");
const bCtx=brightnessCanvas.getContext("2d");
const brightnessDot=document.querySelector('.brightness-dot');

function drawBrightness(){
  brightnessCanvas.width=brightnessCanvas.parentElement.offsetWidth;
  brightnessCanvas.height=brightnessCanvas.parentElement.offsetHeight;
  const width=brightnessCanvas.width;
  const height=brightnessCanvas.height;
  const image=bCtx.createImageData(width,height);
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const s=x/width*100;
      const l=100-(y/height*100);
      const rgb=hslToRgb(hue,s,l);
      const index=(y*width+x)*4;
      image.data[index]=rgb[0];
      image.data[index+1]=rgb[1];
      image.data[index+2]=rgb[2];
      image.data[index+3]=255;
    }
  }
  bCtx.putImageData(image,0,0);
}

function pickBrightness(e){
  draggingBrightness=true;
  const rect=brightnessCanvas.getBoundingClientRect();
  let x=Math.min(Math.max(e.clientX-rect.left,0),rect.width);
  let y=Math.min(Math.max(e.clientY-rect.top,0),rect.height);
  brightnessDot.style.left=x+'px'; brightnessDot.style.top=y+'px';
  sat=x/rect.width*100;
  bright=100-(y/rect.height*100);
  updateActiveBoxColor();
}
brightnessCanvas.addEventListener('mousedown', pickBrightness);
document.addEventListener('mousemove', e=>{if(draggingBrightness) pickBrightness(e);});
document.addEventListener('mouseup', ()=>draggingBrightness=false);

// --- Active box color ---
function updateActiveBoxColor(){
  if(!activeBox) return;
  const color=`hsl(${hue}, ${sat}%, ${bright}%)`;
  activeBox.style.backgroundColor=color;
  const index=[...document.querySelectorAll('.color-box')].indexOf(activeBox);
  colorRules[index]=color;

  // Add to recent colors
  if(!recentColors.includes(color)){
    recentColors.unshift(color);
    if(recentColors.length>5) recentColors.pop();
  }
  updateRecentColors();
  saveProgress();
}

// --- Recent colors ---
function updateRecentColors(){
  const container=document.getElementById("recentColors");
  container.innerHTML='';
  recentColors.forEach(c=>{
    const div=document.createElement("div");
    div.className="recent-color";
    div.style.backgroundColor=c;
    div.onclick=()=>{if(activeBox){activeBox.style.backgroundColor=c; const idx=[...document.querySelectorAll('.color-box')].indexOf(activeBox); colorRules[idx]=c; updateDisplay();}};
    container.appendChild(div);
  });
}

// --- HSL to RGB ---
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=(n)=> (n + h/30) % 12;
  const a=s*Math.min(l,1-l);
  const f=(n)=> l - a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

window.onload=loadProgress;
</script>
</body>
</html>
